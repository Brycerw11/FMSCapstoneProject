<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Home - FMS Capstone Project</title>

		<link rel="stylesheet" type="text/css" href="style.css" />

		<!-- Import Kanit Font -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

		<script src="libraries/p5.min.js"></script>
		<script src="libraries/p5.sound.min.js"></script>
	</head>

	<body>
		<!-- Site Header -->
		<header>
			<div id="logo-container">
				<img id="logo-image" src="https://www.svgrepo.com/show/508699/landscape-placeholder.svg" alt="{Site Name} Logo" id="logo">
			</div>
			<div id="site-title-container">
				<h1 id="site-title" class="kanit">Website Name</h1>
				<h2 id="page-title" class="kanit">Home</h2>
			</div>
			<div></div> <!-- Empty div used for aligning logo and header title -->
		</header>

		<!-- Header Content -->
		<div class="buttons">
			<button class="games">Games</button>

			<div class="bottom-buttons">
				<button class="button">Settings</button>
				<button class="button">Metrics</button>
			</div>
		</div>
	</body>
</html>
