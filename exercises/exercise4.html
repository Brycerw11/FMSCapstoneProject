<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 4 - Shape Matching</title>
	<link rel="stylesheet" type="text/css" href="../style.css" />

    <!-- Import Kanit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Link jQuery 4.0 -->
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
    </script>

    <!-- Exercise4 exclusive CSS -->
    <style>
        .html-overlay{
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            height: 100%;

            touch-action: none;

            z-index: 3 !important;
        }

        button{
            border-radius: 8px;
        }

        /* #region instructions panel css */
        #instructions-panel{
            width: 70vw;
            height: fit-content;
            max-height: 50vh;

            background-color: #a2c4c9;
            
            border: 3px dashed #FFFFFF;
            border-radius: 16px;

            overflow-y: auto;
            z-index: 3 !important;
        }
        #instructions-panel h2{
            font-weight: 400;
            text-align: center;
            margin: 0.5em 0 0.5em 0;
        }
        #instructions-text{
            margin: 1em;
        }
        #start-button-container{
            display: flex;
            justify-content: center;
            margin-bottom: 1em;
        }
        #start-button-container button{
            padding: 0.25em 0.5em 0.25em 0.5em;
            font-size: 1.1em;
            pointer-events: all;
        }
        /* #endregion */

        /* #region round info pane css */
        #round-info-pane{
            position: fixed;
            bottom: 1rem;

            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 1em 0 1em;
            gap: 1em;

            background-color: #a2c4c9;
            
            border: 3px dashed #FFFFFF;
            border-radius: 16px;
        }
        #round-info-pane p{
            margin: 0.35em;
            text-align: left;
        }
        #timer-container{
            display: flex;
        }
        #timer-container > #time-label{
            min-width: 30px;
            margin-left: 0;
        }
        /* #endregion */

        /* #region round complete panel */
        #round-complete-panel{
            width: 70vw;
            height: fit-content;
            max-height: 50vh;

            background-color: #a2c4c9;
            
            border: 3px dashed #FFFFFF;
            border-radius: 16px;

            overflow-y: auto;
            z-index: 3 !important;

            font-weight: 400;
        }
        #round-complete-panel > h2{
            text-align: center;
        }
        #round-complete-panel p{
            text-indent: 1em;
            margin: 1em;
        }
        #next-round-button-container{
            display: flex;
            justify-content: center;
            margin-bottom: 1em;
        }
        #next-round-button-container button{
            padding: 0.25em 0.5em 0.25em 0.5em;
            font-size: 1.1em;
            pointer-events: all;
        }
        /* #endregion */

        canvas{
            touch-action: none;
        }
    </style>
</head>

<body>
    <!-- p5.js Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.js"></script>
    <script src="exercise4.js"></script>

    <!-- Nav Bar -->
    <nav id="nav-bar-container" class="kanit">
        <div id="nav-bar-contents">
            <div id="nav-bar-header">
                <div id="logo-container">
				    <img id="logo-image" src="https://www.svgrepo.com/show/508699/landscape-placeholder.svg" alt="{Site Name} Logo" id="logo">
			    </div>

				<h1 id="site-title" class="nav-bar-title kanit">Website Name</h1>
				<h2 id="page-title" class="nav-bar-title kanit">Games</h2>
            </div>
            <a class="nav-bar-button kanit" href="../index.html">Home</a>
            <a class="nav-bar-button kanit" href="../exerciseSelection.html">Games</a>
            <a class="nav-bar-button kanit" href="../metrics.html">Metrics</a>
            <a class="nav-bar-button kanit" href="../settings.html">Settings</a>
        </div>
        <div id="nav-bar-show-button"> > </div>
    </nav>
    <script src="../navBar.js"></script>

    <!-- Other Page Contents -->
    <noscript>Unable to find JavaScript. This page requires JavaScript. Check to make sure that JavaScript is not disabled in your browser's settings.</noscript>
    
    <div class="html-overlay">
        <div id="instructions-panel" class="kanit">
            <h2>Instructions</h2>
            <p id="instructions-text">
                These are instructions!!!
            </p>
            <div id="start-button-container">
                <button id="start-button" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div id="round-complete-panel" class="kanit">
            <h2>Round Complete!</h2>
            <p id="round-complete-text">
                You made it through round #n!!! It took you --.- seconds!
            </p>
            <br>
            <p class="next-round-info-text">
                Round {n+1} is next. It has n shapes.
            </p>
            <div id="next-round-button-container">
                <button id="next-round-button" onclick="nextRound()">Next Round</button>
            </div>
        </div>

        <div id="round-info-pane" class="kanit">
            <p id="round-label">Round 0</p>
            <div id="timer-container">
                <p id="time-remaining-label">Time Remaining: </p>
                <p id="time-label">60s</p>
            </div>
        </div>
    </div>

</body>
</html>
