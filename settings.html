<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Settings - FMS Capstone Project</title>

	<link rel="stylesheet" type="text/css" href="style.css" />

	<!-- Import Kanit Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

	<!-- Link jQuery 4.0 -->
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous">
	</script>

	<script src="libraries/p5.min.js"></script>
	<script src="libraries/p5.sound.min.js"></script>
</head>

<body>
	<!-- Site Header -->
	<header>
		<div id="logo-container">
			<img id="logo-image" src="https://www.svgrepo.com/show/508699/landscape-placeholder.svg" alt="{Site Name} Logo" id="logo">
		</div>
		<div class="center-content">
			<div id="site-title-container">
				<h1 id="site-title" class="kanit">Website Name</h1>
				<h2 id="page-title" class="kanit">Settings</h2>
			</div>
		</div>
	</header>

	<!-- Nav Bar -->
    <nav id="nav-bar-container" class="kanit start-showing">
        <div id="nav-bar-contents" class="headerless-nav-bar">
            <a class="nav-bar-button kanit" href="index.html">Home</a>
            <a class="nav-bar-button kanit" href="./exerciseSelection.html">Games</a>
            <a class="nav-bar-button kanit" href="./metrics.html">Metrics</a>
            <a class="nav-bar-button kanit curr-page" href="">Settings</a>
        </div>
        <div id="nav-bar-show-button"> > </div>
    </nav>
	<script src="./navBar.js"></script>

	<!-- Page Content -->
	<div id="settings-content" class="kanit">
		<!-- Audio Toggle Setting -->
		<div class="justify-center setting-container">
			<p class="settings-label">Audio Toggle: </p>
			<div id="audio-toggle-slider" class="slider slider-on inline">
				<div class="slider-handle"></div>
			</div>
		</div>

		<!-- Audio Volume Setting -->
		<div class="justify-center setting-container">
			<p class="settings-label">Volume: </p>
			<input type="range" name="volume" id="volume-range" min="0" max="100" value="75" class="inline">
		</div>

		<!-- TODO: Music Toggle Setting -->

		<!-- TODO: Clear Settings Button -->
	</div>
		
	<script src="./assets/scripts/settings.js"></script>
</body>
</html>
